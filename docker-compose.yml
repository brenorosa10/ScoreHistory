services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      PORT: "8080"
      ConnectionStrings__Default: ${ConnectionStrings__Default}
      Jwt__Key: ${Jwt__Key}
      Jwt__Issuer: ${Jwt__Issuer:-ScoreHistory}
      Jwt__Audience: ${Jwt__Audience:-ScoreHistory}
      Cors__Origins: ${Cors__Origins:-http://localhost}
    expose:
      - "8080"
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 25s
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scorehistory-frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - default
      - proxy

networks:
  proxy:
    external: true
